server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /env.js {
    try_files /env.js =404;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
